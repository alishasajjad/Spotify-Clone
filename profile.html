<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Spotify Clone</title>
  <link rel="stylesheet" href="assets/styles/style.css">
  <link rel="stylesheet" href="assets/styles/profile.css">
  <link rel="stylesheet" href="assets/styles/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets\images\spotify_logo1.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets\images\spotify_logo1.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets\images\spotify_logo1.png">
<link rel="manifest" href="assets\images\spotify_logo1.jpg">
</head>
<body class="page-transition">
  <div class="animated-background"></div>
  
  <header>
    <div class="logo">
      <img src="assets/images/spotify_logo1.png" alt="Spotify Logo">
    </div>
    <nav>
      <a href="home.html"><i class="fas fa-home"></i> Home</a>
      <a href="browse.html"><i class="fas fa-search"></i> Browse</a>
      <a href="library.html"><i class="fas fa-book"></i> Library</a>
      <a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a>
    </nav>
  </header>

  <main>
    <section class="profile-container">
      <div class="profile-card">
        <div class="profile-header">
          <h1 id="profileTitle">User Profile</h1>
          <div class="user-info">
          <div class="info-item">
            <label>Name</label>
            <span id="userName">John Doe</span>
            <input type="text" id="editName" class="edit-field" style="display: none;">
          </div>
          <div class="info-item">
            <label>Email</label>
            <span id="userEmail">john@example.com</span>
            <input type="email" id="editEmail" class="edit-field" style="display: none;">
          </div>
          <div class="info-item">
            <label>Password</label>
            <span id="userPassword">••••••••</span>
            <div class="password-input-wrapper" style="display: none;">
              <input type="password" id="editPassword" class="edit-field">
              <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password visibility">
                <i class="fas fa-eye" id="passwordToggleIcon"></i>
              </button>
            </div>
          </div>
          <div class="info-item">
            <label>Status</label>
            <span class="membership-info">Spotify Premium Member</span>
          </div>
        </div>
        </div>
        
        <div class="profile-actions">
          <button id="editProfileBtn" class="btn-primary"><i class="fas fa-edit"></i> Edit Profile</button>
          <button id="updateProfileBtn" class="btn-success" style="display: none;"><i class="fas fa-check"></i> Update</button>
          <button id="cancelEditBtn" class="btn-secondary" style="display: none;"><i class="fas fa-times"></i> Cancel</button>
          <button id="logoutBtn" class="btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <div id="updateMessage" class="update-message"></div>
      </div>
    </section>
  </main>

  <div id="musicPlayerContainer"></div>

  <script src="scripts/app.js"></script>
  <script src="scripts/profile.js"></script>
  <script src="scripts/musicPlayer.js"></script>
</body>
</html>
