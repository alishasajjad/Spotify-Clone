<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Spotify Clone</title>
<link rel="apple-touch-icon" sizes="180x180" href="assets\images\spotify_logo1.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets\images\spotify_logo1.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets\images\spotify_logo1.png">
  <link rel="stylesheet" href="assets/styles/style.css">
  <link rel="stylesheet" href="assets/styles/signup.css">
  <link rel="stylesheet" href="assets/styles/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-transition">
  <div class="signup-container">
    <h2>Create Account</h2>
    <form id="signupForm">
      <div class="form-group">
        <input type="text" id="name" placeholder="Name" required>
        <div class="error-message" id="name-error"></div>
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
        <div class="error-message" id="email-error"></div>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
        <div class="error-message" id="password-error"></div>
        <div class="password-requirements">
          Password must contain at least 6 characters, 1 number, and 1 uppercase letter
        </div>
      </div>
      <div class="form-group">
        <button type="submit" id="signupButton">
          <span class="button-text">Sign Up</span>
          <span class="spinner"></span>
        </button>
      </div>
      <div class="error-message" id="signup-error"></div>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="scripts/auth.js"></script>
</body>
</html>
